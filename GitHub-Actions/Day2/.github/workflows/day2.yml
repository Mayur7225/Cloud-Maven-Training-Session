name: Day2 CI Pipeline

on:
  push:
     branches:
       - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Branch and Commit
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Build Step
        run: echo "Building application..."

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test Step
        run: echo "Running tests..."
