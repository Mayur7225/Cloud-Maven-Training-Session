version: "3.8"

services:
  app:
    image: mayur7225/flask-app:v1
    container_name: flask_app
    restart: always
    depends_on:
      - mysql
    ports:
      - "5000:5000"
    networks:
      - mynet

  mysql:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mynet

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mynet

networks:
  mynet:

volumes:
  mysql_data:
